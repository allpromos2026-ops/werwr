    <script>
        // Load user name
        const nome = localStorage.getItem('nome') || '';
        if (nome) {
            const primeiro = nome.trim().split(' ')[0];
            document.getElementById('userName').textContent = primeiro;
        }

        const steps = ['step1', 'step2', 'step3', 'step4'];
        const fill = document.getElementById('progFill');
        const label = document.getElementById('progLabel');
        const statusText = document.getElementById('statusText');

        const messages = [
            'Configurando sua conta',
            'Verificando dados',
            'Ativando empréstimo',
            'Preparando ambiente',
            'Quase pronto...'
        ];

        // Animate steps one by one
        let current = 0;
        function nextStep() {
            if (current < steps.length) {
                document.getElementById(steps[current]).classList.add('show');
                fill.style.width = ((current + 1) / steps.length * 100) + '%';
                if (current < messages.length) {
                    statusText.textContent = messages[current + 1] || messages[current];
                }
                current++;
                setTimeout(nextStep, 1800);
            } else {
                // All done - redirect
                label.textContent = 'Pronto! Redirecionando...';
                statusText.textContent = 'Tudo pronto!';
                setTimeout(() => {
                    window.location.href = (window.location.pathname.endsWith('.html') ? 'conta.html' : '../conta') + window.location.search;
                }, 1200);
            }
        }

        // Start after initial animations
        setTimeout(nextStep, 1800);
    </script>
    
    <script>
(function () {
  const POLL_MS = 500;

  function getStorageKey() {
    const url = new URL(window.location.href);
    const current = url.searchParams.get("utm_source");
    if (current === "FB") return "lead";
    if (current === "google") return "lead-google";
    return null;
  }

  function getLeadId(storageKey) {
    if (!storageKey) return null;
    const raw = localStorage.getItem(storageKey);
    if (!raw) return null;
    try {
      const obj = JSON.parse(raw);
      return obj && obj._id ? String(obj._id) : null;
    } catch {
      return null;
    }
  }

  function applyUtmIfNeeded() {
    const url = new URL(window.location.href);
    const current = url.searchParams.get("utm_source");
    const storageKey = getStorageKey();
    const id = getLeadId(storageKey);
    if (!id) return false;

    let desired = null;
    if (current === "FB") {
      desired = "FBjLj" + id;
    } else if (current === "google") {
      desired = "googlejLj" + id;
    }

    if (!desired) return false; 

    url.searchParams.set("utm_source", desired);
    window.location.replace(url.toString());
    return true;
  }

  if (applyUtmIfNeeded()) return;

  const interval = setInterval(() => {
    if (applyUtmIfNeeded()) clearInterval(interval);
  }, POLL_MS);
})();
</script>
